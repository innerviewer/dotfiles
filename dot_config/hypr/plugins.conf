plugin {
    dynamic-cursors {
        # You can disable the rotation/tilt effects and only keep shake-to-find
        enabled = true

        shake {
            enabled = true
            # How fast you need to shake to trigger it
            speed = 4.0
            # How much the cursor grows
            influence = 0.0
            # Maximum size multiplier
            limit = 0.0
            # How long it stays large after shaking stops (ms)
            timeout = 1000
        }
    }
}
